[workspace]
resolver = "3"
members = [
  "crates/inferd",
  "crates/inferd-client",
  "crates/inferd-probe",
  "crates/porter-infer",
  "crates/porter-bridge",
  "crates/porter-router",
  "crates/porter-turns",
  "crates/porter-tailnet",
  "crates/steward-dbus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/steward"
publish = false

[workspace.dependencies]
# This workspace's own crates.
inferd = { path = "crates/inferd" }
inferd-client = { path = "crates/inferd-client" }
porter-infer = { path = "crates/porter-infer" }
porter-router = { path = "crates/porter-router" }
porter-turns = { path = "crates/porter-turns" }
porter-bridge = { path = "crates/porter-bridge" }
porter-tailnet = { path = "crates/porter-tailnet" }
steward-dbus = { path = "crates/steward-dbus" }
inferd-probe = { path = "crates/inferd-probe" }


# porter's crates, by git at one rev (the placeholder is filled when the cut is gated). steward
# depends on porter; porter never depends on steward.
porter-callers = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-capability = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-client = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-client-dbus = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-core = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-daemon = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427", default-features = false }
porter-dbus = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-dbus-macros = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-fake = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-fake-servers = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-fs = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-http = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-http-reqwest = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-ids = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-match = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-provider = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-secrets = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-settings = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-store = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-tailscale = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
porter-wire = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }
test-kit = { git = "https://github.com/PoHsuanLai/porter", rev = "c718d2036daad7e052e1d89f1fe0ca4679168427" }

# quire's live settings modules (`org.quire.SettingsModule1`), by git at quire's pinned rev; `live`
# is the module, `tokio` drives its zbus.
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767", features = ["live", "tokio"] }

# stoker's crates, by git at stoker's pinned rev. stoker has no porter dependency, so there is no
# cycle. inferd is the one place porter's types and stoker's meet. `model-http` carries the reqwest
# client behind its `client` feature; `vision-prep` the frame resize behind `pixels`; the testing
# features hold stoker's scripted fakes of the supervisor's seams. `model-wire` is the
# codec-over-transport `Driver`: inferd's TLS transport to a cloud model is a `model_http::Transport`
# of its own, so it names the driver that takes one.
cua-action = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
cua-parse = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
cua-session = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
cua-vendors = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
engine-manifest = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
engine-probe = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
engine-spec = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
engine-supervisor = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-catalog = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-extract = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-http = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-openai-compat = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-provider = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-replay = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
model-wire = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
speech-host-client = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
speech-provider = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }
vision-prep = { git = "https://github.com/PoHsuanLai/stoker", rev = "98621a2f3730ea1c3e0b8abce00f8e4fe91fe7d7" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim, only the lines the
# crates here name.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hyper = "1"
hyper-util = "0.1.21"
http-body-util = "0.1"
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }
# Calendar dates and RFC 3339 times (MIT OR Apache-2.0). No default features: no system clock, no
# time zone database, no locale; `alloc` is for `format`.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# stoker's `Money` (model-provider) is an exact decimal amount in an ISO 4217 currency; the crates
# that make or read one name these two (both MIT, which deny.toml allows).
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
iso_currency = { version = "0.7", features = ["with-serde"] }
# inferd's agent token: random bytes from the system (MIT OR Apache-2.0) and a constant-time
# compare (BSD-3-Clause).
getrandom = "0.4.3"
subtle = "2.6.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Dependencies keep no debug info (this workspace's own crates keep line tables, `.cargo/config.toml`):
# it is most of what a test link carries.
[profile.dev.package."*"]
debug = false
