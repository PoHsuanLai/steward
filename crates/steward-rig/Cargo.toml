[package]
name = "steward-rig"
description = "Test tooling, never installed and never in dist: steward-rig-client acts as an app over the session bus a jailed scenario gives it and opens an inferd session, with one chat turn when asked. The identity fixture is porter-rig's, so the same --proc-root tree names it to accountd and inferd alike. Nothing shipped depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "steward-rig-client"
path = "src/bin/steward-rig-client.rs"

[dependencies]
inferd-client = { workspace = true, features = ["dbus"] }
porter-capability = { workspace = true }
porter-core = { workspace = true }
porter-ids = { workspace = true }
porter-infer = { workspace = true }
porter-match = { workspace = true }
porter-rig = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true
